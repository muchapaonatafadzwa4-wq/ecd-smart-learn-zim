<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECD Smart-Learn Zim</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2A93B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF9EC;
    --ink:#2D2A32;
    --ink-soft:#5B5665;
    --english:#FFC93C;
    --maths:#3AAED8;
    --science:#4CAF7D;
    --social:#E8734A;
    --pea:#D6538C;
    --lang:#7B5EA7;
    --games:#FF6B57;
    --rhythms:#2EC4B6;
    --quiz:#F2A93B;
    --card-shadow: 0 6px 0 rgba(0,0,0,0.12);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --cream:#211D2B;
      --ink:#F5F1E8;
      --ink-soft:#C9C3D6;
      --card-shadow: 0 6px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --cream:#211D2B;
    --ink:#F5F1E8;
    --ink-soft:#C9C3D6;
    --card-shadow: 0 6px 0 rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    height:100%;
    margin:0;
    background:var(--cream);
    font-family:'Nunito', system-ui, sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  h1,h2,.headline{ font-family:'Baloo 2', system-ui, sans-serif; }

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 30%, #FFE39A 0%, var(--cream) 65%);
    text-align:center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 10;
  }
  #splash.hide{ opacity:0; transform: scale(1.05); pointer-events:none; }
  .logo-badge{
    width:104px; height:104px; border-radius:32px;
    background: linear-gradient(160deg, var(--quiz), var(--social));
    display:flex; align-items:center; justify-content:center;
    font-size:52px;
    box-shadow: var(--card-shadow);
    margin-bottom: 18px;
    animation: pop 0.7s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{ 0%{ transform: scale(0.4) rotate(-8deg); opacity:0;} 100%{ transform: scale(1) rotate(0); opacity:1;} }
  #splash h1{ font-size: 30px; font-weight:800; margin: 4px 0; line-height:1.15; }
  #splash .tagline{ font-size:16px; color:var(--ink-soft); font-weight:700; margin-top:6px; max-width: 280px; }
  .tap-hint{ margin-top:34px; font-size:13px; color:var(--ink-soft); font-weight:700; opacity:0.8;}

  /* ---------- HOME ---------- */
  #home{ min-height:100%; padding: 16px 16px 40px; display:none; }
  #home.show{ display:block; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding: 6px 4px 14px; }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mini-badge{
    width:38px; height:38px; border-radius:12px;
    background: linear-gradient(160deg, var(--quiz), var(--social));
    display:flex; align-items:center; justify-content:center; font-size:20px;
    flex-shrink:0;
  }
  .brand-title{ font-size:15px; font-weight:800; line-height:1.1; }
  .brand-title small{ display:block; font-family:'Nunito'; font-weight:700; font-size:10.5px; color:var(--ink-soft); }
  .icon-btn{
    width:42px; height:42px; border-radius:14px; border:none;
    background: rgba(123,94,167,0.14);
    color: var(--lang);
    font-size:19px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ transform: scale(0.92); }

  .section-label{ font-size:13px; font-weight:800; color:var(--ink-soft); margin: 18px 4px 10px; letter-spacing:0.2px; }

  .grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:12px;
  }
  .area-card{
    border:none; border-radius:22px; padding: 16px 10px 14px;
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    color:#fff; text-align:left; cursor:pointer;
    box-shadow: var(--card-shadow);
    transform: translateY(0);
    transition: transform .12s ease, box-shadow .12s ease;
    min-height: 108px;
    position:relative;
    overflow:hidden;
  }
  .area-card:active{ transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .area-card .emoji{ font-size:30px; }
  .area-card .label{ font-family:'Baloo 2'; font-weight:700; font-size:15px; line-height:1.15; }

  .card-english{ background: linear-gradient(155deg,var(--english),#F7A93C); color:#3A2A00; }
  .card-maths{ background: linear-gradient(155deg,var(--maths),#2E86AB); }.card-social{ background: linear-gradient(155deg,var(--social),#D14F3E); }
  .card-pea{ background: linear-gradient(155deg,var(--pea),#B23A73); }
  .card-lang{ background: linear-gradient(155deg,var(--lang),#5C4189); }

  .wide-row{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .wide-btn{
    border:none; border-radius:22px; padding: 16px 18px;
    display:flex; align-items:center; gap:14px;
    color:#fff; font-family:'Baloo 2'; font-weight:700; font-size:16px;
    cursor:pointer; box-shadow: var(--card-shadow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .wide-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .wide-btn .emoji{ font-size:26px; }
  .btn-games{ background: linear-gradient(100deg,var(--games),#E8502E); }
  .btn-rhythms{ background: linear-gradient(100deg,var(--rhythms),#1D9E93); }
  .btn-quiz{ background: linear-gradient(100deg,var(--quiz),#D98A1E); }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; left:50%; bottom: calc(28px + env(safe-area-inset-bottom,0px));
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--cream);
    padding: 12px 20px; border-radius:16px; font-weight:700; font-size:14px;
    opacity:0; transition: opacity .25s ease, transform .25s ease;
    pointer-events:none; max-width: 86%; text-align:center;
    z-index: 20;
  }
  #toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ---------- LESSON SCREENS ---------- */
  .lesson-screen{ display:none; min-height:100%; padding: 16px 16px 40px; }
  .lesson-screen.show{ display:block; }
  .lesson-topbar{ display:flex; align-items:center; gap:12px; padding: 6px 4px 6px; }
  .back-btn{
    width:42px; height:42px; border-radius:14px; border:none;
    background: rgba(45,42,50,0.08); color:var(--ink);
    font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .back-btn:active{ transform: scale(0.92); }
  .lesson-title{ font-family:'Baloo 2'; font-weight:800; font-size:19px; }
  .lesson-title small{ display:block; font-family:'Nunito'; font-weight:700; font-size:11.5px; color:var(--ink-soft); }

  .lesson-card{
    background: #fff2cf; border-radius:26px; padding: 26px 20px;
    text-align:center; margin: 16px 0; box-shadow: var(--card-shadow);
  }
  :root[data-theme="dark"] .lesson-card,
  :root:not([data-theme="light"]) .lesson-card{ background:#3A3348; }
  @media (prefers-color-scheme: light){ .lesson-card{ background:#fff2cf; } }

  .big-letter{ font-family:'Baloo 2'; font-weight:800; font-size:64px; color:var(--social); line-height:1; }
  .big-emoji{ font-size:70px; margin: 10px 0; }
  .lesson-sentence{ font-family:'Baloo 2'; font-weight:700; font-size:20px; margin-top:6px; }
  .speak-btn{
    margin-top:16px; border:none; border-radius:16px; padding:10px 20px;
    background: var(--english); color:#3A2A00; font-family:'Baloo 2'; font-weight:700; font-size:15px;
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; box-shadow: var(--card-shadow);
  }
  .speak-btn:active{ transform: translateY(4px); box-shadow:none; }

  .activity-label{ font-size:14px; font-weight:800; color:var(--ink-soft); margin: 22px 4px 12px; text-align:center; }
  .option-row{ display:flex; gap:12px; justify-content:center; }
  .option-btn{
    width:84px; height:84px; border-radius:20px; border: 3px solid transparent;
    background:#fff; font-size:38px; cursor:pointer; box-shadow: var(--card-shadow);
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, border-color .12s ease;
  }
  :root[data-theme="dark"] .option-btn,
  :root:not([data-theme="light"]) .option-btn{ background:#3A3348; }
  @media (prefers-color-scheme: light){ .option-btn{ background:#fff; } }
  .option-btn:active{ transform: scale(0.94); }
  .option-btn.correct{ border-color:var(--science); background: rgba(76,175,125,0.18); }
  .option-btn.wrong{ border-color:var(--social); background: rgba(232,115,74,0.18); }

  .complete-banner{
    margin-top:22px; text-align:center; font-family:'Baloo 2'; font-weight:800;
    color:var(--science); font-size:17px; display:none;
  }
  .complete-banner.show{ display:block; }

  /* ---------- LANGUAGE SELECTOR ---------- */
  .lang-list{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .lang-chip{
    display:flex; align-items:center; gap:14px;
    border:none; border-radius:18px; padding: 14px 16px;
    background:#fff; box-shadow: var(--card-shadow); cursor:pointer; text-align:left;
  }
  :root[data-theme="dark"] .lang-chip,
  :root:not([data-theme="light"]) .lang-chip{ background:#3A3348; }
  @media (prefers-color-scheme: light){ .lang-chip{ background:#fff; } }
  .lang-chip:active{ transform: translateY(3px); box-shadow:none; }
  .lang-dot{
    width:14px; height:14px; border-radius:50%; flex-shrink:0;
  }
  .lang-dot.active{ background: var(--science); }
  .lang-dot.planned{ background: var(--ink-soft); opacity:0.5; }
  .lang-info{ flex:1; }
  .lang-name{ font-family:'Baloo 2'; font-weight:700; font-size:15.5px; }
  .lang-status{ font-size:11.5px; font-weight:700; color: var(--ink-soft); margin-top:1px; }
  .lang-status.active{ color: var(--science); }

  .jump-btn{
    width:140px; height:140px; border-radius:50%; border:none;
    background: linear-gradient(155deg,var(--pea),#B23A73);
    font-size:56px; color:#fff; cursor:pointer; margin: 8px auto 6px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--card-shadow);
  }
  .jump-btn:active{ transform: translateY(4px) scale(0.97); box-shadow:none; }
  .jump-count{ font-family:'Baloo 2'; font-weight:800; font-size:18px; margin-top:10px; color:var(--ink-soft); }

  .speak-btn.pending{
    background: rgba(45,42,50,0.10); color: var(--ink-soft); cursor:default;
  }
  .speak-btn.pending:active{ transform:none; }
  .word-native{ font-family:'Baloo 2'; font-weight:800; font-size:34px; color:var(--lang); }

  .quiz-progress{ font-size:13px; font-weight:800; color:var(--ink-soft); text-align:center; margin: 4px 0 14px; }
  .quiz-emoji{ font-size:48px; text-align:center; margin-bottom:6px; }
  .quiz-question{ font-family:'Baloo 2'; font-weight:800; font-size:19px; text-align:center; margin: 6px 0 20px; }
  .quiz-opt-list{ display:flex; flex-direction:column; gap:10px; }
  .quiz-opt{
    border:3px solid transparent; border-radius:16px; padding:14px 16px;
    background:#fff; font-family:'Baloo 2'; font-weight:700; font-size:16px;
    text-align:left; cursor:pointer; box-shadow: var(--card-shadow);
  }
  :root[data-theme="dark"] .quiz-opt,
  :root:not([data-theme="light"]) .quiz-opt{ background:#3A3348; }@media (prefers-color-scheme: light){ .quiz-opt{ background:#fff; } }
  .quiz-opt:active{ transform: translateY(3px); box-shadow:none; }
  .quiz-opt.correct{ border-color:var(--science); background: rgba(76,175,125,0.18); }
  .quiz-opt.wrong{ border-color:var(--social); background: rgba(232,115,74,0.18); }
  .quiz-next-btn{
    display:none; width:100%; margin-top:18px; border:none; border-radius:16px; padding:14px;
    background: var(--quiz); color:#3A2A00; font-family:'Baloo 2'; font-weight:800; font-size:16px;
    cursor:pointer; box-shadow: var(--card-shadow);
  }
  .quiz-next-btn.show{ display:block; }
  .quiz-next-btn:active{ transform: translateY(4px); box-shadow:none; }
  .quiz-result{ text-align:center; padding-top: 30px; display:none; }
  .quiz-result.show{ display:block; }
  .quiz-result .score-emoji{ font-size:60px; }
  .quiz-result .score-text{ font-family:'Baloo 2'; font-weight:800; font-size:22px; margin:14px 0 6px; }
  .quiz-result .score-sub{ color:var(--ink-soft); font-weight:700; font-size:14px; margin-bottom:22px; }

  .memory-grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:10px;
  }
  .memory-card{
    aspect-ratio: 1 / 1; border-radius:16px; border:none;
    background: linear-gradient(155deg,var(--lang),#5C4189);
    font-size:32px; color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: var(--card-shadow);
  }
  .memory-card:active{ transform: translateY(3px); box-shadow:none; }
  .memory-card.flipped{ background:#fff; color:var(--ink); }
  :root[data-theme="dark"] .memory-card.flipped,
  :root:not([data-theme="light"]) .memory-card.flipped{ background:#3A3348; color:var(--ink); }
  @media (prefers-color-scheme: light){ .memory-card.flipped{ background:#fff; } }
  .memory-card.matched{ background: rgba(76,175,125,0.25); color:var(--science); cursor:default; }
  .memory-progress{ font-size:13px; font-weight:800; color:var(--ink-soft); text-align:center; margin: 4px 0 12px; }

  .count-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-top:14px; }
  .count-btn{
    aspect-ratio:1/1; border-radius:18px; border:3px solid transparent;
    background: linear-gradient(155deg,var(--maths),#2E86AB); color:#fff;
    font-family:'Baloo 2'; font-weight:800; font-size:30px; cursor:pointer;
    box-shadow: var(--card-shadow);
  }
  .count-btn:active{ transform: translateY(3px); box-shadow:none; }
  .count-btn.done{ background: rgba(76,175,125,0.25); color:var(--science); border-color:var(--science); cursor:default; }
  .count-btn.wrong{ border-color:var(--social); }

  .rhythm-pattern{ font-size:34px; text-align:center; letter-spacing:10px; margin: 12px 0; }
  .rhythm-pattern span.pause{ opacity:0.25; }
  .clap-btn{
    display:block; margin: 14px auto 0; border:none; border-radius:20px;
    width:120px; height:120px; border-radius:50%;
    background: linear-gradient(155deg,var(--rhythms),#1D9E93); color:#fff;
    font-size:44px; cursor:pointer; box-shadow: var(--card-shadow);
  }
  .clap-btn:active{ transform: translateY(4px) scale(0.97); box-shadow:none; }
  .rhyme-lines{ font-family:'Baloo 2'; font-weight:700; font-size:17px; line-height:1.7; text-align:center; margin: 10px 0 4px; }
  .rhyme-icons{ font-size:26px; text-align:center; letter-spacing:14px; margin-top:10px; }
  .source-note{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:10px; font-weight:700; }

  .prog-bar{ height:16px; border-radius:99px; background: rgba(45,42,50,0.12); overflow:hidden; margin-top:12px; }
  .prog-fill{ height:100%; width:0%; border-radius:99px; background: linear-gradient(90deg,var(--quiz),var(--social)); transition: width .4s ease; }
  .prog-big{ font-family:'Baloo 2'; font-weight:800; font-size:26px; text-align:center; }
  .badge-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .badge{ border-radius:18px; padding:14px 10px; text-align:center; background:#fff; box-shadow: var(--card-shadow); }
  :root[data-theme="dark"] .badge,
  :root:not([data-theme="light"]) .badge{ background:#3A3348; }
  @media (prefers-color-scheme: light){ .badge{ background:#fff; } }
  .badge .b-emoji{ font-size:34px; }
  .badge .b-name{ font-family:'Baloo 2'; font-weight:700; font-size:14px; margin-top:2px; }
  .badge .b-desc{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-top:2px; }
  .badge.locked{ opacity:0.45; filter:grayscale(1); }
  .check-row{ display:flex; align-items:center; gap:10px; padding:9px 4px; font-weight:700; font-size:14px; border-bottom:1px solid rgba(128,128,128,0.18); }
  .check-row .tick{ width:24px; text-align:center; }
  .toggle-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:none; border-bottom:1px solid rgba(128,128,128,0.18);
    padding:12px 4px; cursor:pointer; color:var(--ink);
    font-family:'Nunito'; font-weight:800; font-size:14.5px;
  }
  .toggle-row .tstate{ margin-left:auto; font-size:12px; color:var(--ink-soft); }
  .toggle-row.off{ opacity:0.55; }
  .who-chip{
    display:inline-flex; align-items:center; gap:8px; border:none; border-radius:99px;
    padding:8px 14px; margin: 2px 4px 0; cursor:pointer;
    background: rgba(123,94,167,0.16); color:var(--lang);
    font-family:'Baloo 2'; font-weight:700; font-size:14px;
  }
  .who-chip:active{ transform: scale(0.97); }
  .t-label{ display:block; font-size:13px; font-weight:800; color:var(--ink-soft); margin: 14px 4px 6px; }
  .t-input{
    width:100%; padding:14px; border-radius:14px; border:2px solid rgba(128,128,128,0.35);
    background: rgba(128,128,128,0.08); color:var(--ink);
    font-family:'Nunito'; font-weight:700; font-size:16px;
  }
  .t-input:focus{ outline:none; border-color: var(--lang); }
  .t-error{ color:var(--social); font-weight:800; font-size:13px; min-height:18px; margin:8px 4px 0; }
  .t-btn{
    display:block; width:100%; margin-top:14px; border:none; border-radius:16px; padding:14px;
    background: var(--lang); color:#fff; font-family:'Baloo 2'; font-weight:800; font-size:16px;
    cursor:pointer; box-shadow: var(--card-shadow);
  }
  .t-btn:active{ transform: translateY(4px); box-shadow:none; }
  .t-btn.soft{ background: rgba(123,94,167,0.16); color: var(--lang); box-shadow:none; }
  .t-link{ background:none; border:none; color:var(--ink-soft); font-weight:800; font-size:13px; margin-top:14px; width:100%; cursor:pointer; text-decoration:underline; }
  .t-stats{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-top:12px; }
  .t-stat{ text-align:center; padding:10px 4px; border-radius:14px; background: rgba(128,128,128,0.10); }
  .t-stat b{ display:block; font-family:'Baloo 2'; font-size:20px; }
  .t-stat span{ font-size:11px; font-weight:800; color:var(--ink-soft); }
  details.res{ border-radius:16px; background:#fff; box-shadow: var(--card-shadow); padding:12px 14px; margin-bottom:10px; }
  :root[data-theme="dark"] details.res,
  :root:not([data-theme="light"]) details.res{ background:#3A3348; }
  @media (prefers-color-scheme: light){ details.res{ background:#fff; } }
  details.res summary{ font-family:'Baloo 2'; font-weight:700; font-size:15px; cursor:pointer; }
  details.res p{ margin:8px 0 2px; font-size:14px; line-height:1.5; font-weight:600; }
  .reset-btn{ margin-top:22px; width:100%; border:none; border-radius:14px; padding:12px; background: rgba(232,115,74,0.15); color: var(--social); font-family:'Baloo 2'; font-weight:700; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

  <div id="splash" onclick="goHome()">
    <div class="logo-badge">🎓</div>
    <h1>ECD Smart-Learn Zim</h1>
    <div class="tagline">Learning, Culture and Fun in One App.</div>
    <div class="tap-hint">Tap anywhere to continue</div>
  </div>

  <div id="home">
    <div class="topbar">
      <div class="brand">
        <div class="mini-badge">🎓</div>
        <div class="brand-title">ECD Smart-Learn Zim<small>Learning, Culture and Fun in One App.</small></div>
